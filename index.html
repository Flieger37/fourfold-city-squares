<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fourfold city squares</title>
    <style>
        /* 1. VARIABLEN FÜR LIGHT & DARK MODE */
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --border-color: #eeeeee;
            --secondary-text: #777777;
            --frame-color: #e0e0e0;
            --line-color: #cccccc;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #f0f0f0;
            --border-color: #333333;
            --secondary-text: #aaaaaa;
            --frame-color: #2a2a2a;
            --line-color: #444444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 2. HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        header > .header-item { flex: 1; display: flex; align-items: stretch; overflow: visible; }
        .header-left { min-width: 0; }
        .header-right { min-width: 0; justify-content: flex-end; }
        .bracket-box { display: flex; align-items: center; justify-content: center; }
        .bracket-inner { display: flex; align-items: center; justify-content: center; position: relative; margin: -10px; padding: 10px; }
        .header-left { justify-content: flex-start; }
        .header-right { justify-content: flex-end; }

        /* BRACKETS */
        .bracket-box { position: relative; padding: 10px; border-radius: 6px; }
        .bracket-box::before, .bracket-box::after, .bracket-inner::before, .bracket-inner::after {
            content: ""; position: absolute; width: 6px; height: 6px; border-color: var(--text-color); border-style: solid;
        }
        .bracket-box::before { top: 0; left: 0; border-width: 1px 0 0 1px; border-top-left-radius: 6px;}
        .bracket-box::after { top: 0; right: 0; border-width: 1px 1px 0 0; border-top-right-radius: 6px;}
        .bracket-inner::before { bottom: 0; left: 0; border-width: 0 0 1px 1px; border-bottom-left-radius: 6px;}
        .bracket-inner::after { bottom: 0; right: 0; border-width: 0 1px 1px 0; border-bottom-right-radius: 6px;}

        .logo-text { font-size: 0.9rem; line-height: 1.1; text-transform: lowercase; }

        /* HAUPTTITEL */
        .main-title { 
            font-size: 2.2rem;
            font-weight: 300; 
            margin: 0; 
            line-height: 1; 
            text-transform: lowercase; 
            text-align: center; 
        }

        /* AUSWAHLMENÜ */
        .select-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .sort-label {
            font-size: 0.65rem;
            text-transform: lowercase;
            color: var(--secondary-text);
            opacity: 0.4;
            margin-right: 2px;
        }

        .sort-toggle {
            display: flex;
            justify-content: center;
            gap: 4px;
            font-size: 0.65rem;
            text-transform: lowercase;
            color: var(--secondary-text);
        }

        .sort-btn {
            background: none;
            border: none;
            padding: 0 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.65rem;
            color: var(--secondary-text);
            text-transform: lowercase;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .sort-btn.active {
            opacity: 1;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .sort-divider {
            color: var(--secondary-text);
            opacity: 0.4;
            line-height: 1;
            align-self: center;
        }

        .select-container { position: relative; display: inline-flex; align-items: center; justify-content: center; width: var(--select-width, auto); }
        .select-container select { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
        .select-label { font-family: inherit; font-size: 0.9rem; text-transform: lowercase; color: var(--text-color); pointer-events: none; white-space: nowrap; }
        .arrow { font-size: 1.4rem; line-height: 1; color: var(--secondary-text); pointer-events: none; margin-left: 3px; }
        #citySelect {
            font-family: inherit; 
            font-size: 0.9rem; 
            line-height: 1.1; 
            padding: 0;
            border: none; 
            outline: none; 
            background: none;
            color: var(--text-color); 
            cursor: pointer; 
            appearance: none; 
            text-transform: lowercase;
            text-align: center;
            width: var(--select-width, auto);
        }

        /* 3. CONTENT */
        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .main-visual { 
            position: relative; width: 562.5px; height: 562.5px; 
            max-width: 80vw; max-height: 70vh; aspect-ratio: 1 / 1;
            border: 7.5px solid var(--frame-color); background-size: cover; background-position: center;
            background-image: url('bilder/mein-hauptbild.jpg'); 
        }
        .main-visual::before { content: ""; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: var(--line-color); transform: translateY(-50%); }
        .main-visual::after { content: ""; position: absolute; left: 50%; top: 0; width: 2px; height: 100%; background: var(--line-color); transform: translateX(-50%); }

        .gallery-container { width: 100%; max-width: 875px; text-align: center; }
        .home-container { display: flex; flex-direction: column; align-items: center; }
        .home-container.hidden { display: none !important; }
        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; justify-items: center; }
        .gallery img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border: 7.5px solid var(--frame-color); box-sizing: border-box; cursor: zoom-in; }
        
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.85);
            align-items: center;
            justify-content: center;
        }
        #lightbox.active { display: flex; }
        #lightbox-img {
            max-width: min(90vw, 90vh);
            max-height: min(90vw, 90vh);
            width: auto;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border: 7.5px solid var(--frame-color);
            box-sizing: border-box;
            display: block;
        }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 2rem;
            cursor: pointer;
            padding: 20px;
            line-height: 1;
            transition: color 0.2s;
            user-select: none;
        }
        .lightbox-nav:hover { color: rgba(255, 255, 255, 0.95); }
        #lightbox-prev { left: 10px; }
        #lightbox-next { right: 10px; }
        #lightbox-close {
            position: absolute;
            top: 20px;
            right: 24px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }
        #lightbox-close:hover { color: rgba(255, 255, 255, 0.95); }
        #lightbox-counter {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.35);
            text-transform: lowercase;
            letter-spacing: 0.05em;
        }

        .city-nav-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }
        .city-nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            color: var(--text-color);
            opacity: 0.35;
            transition: opacity 0.2s;
            width: 80px;
        }
        .city-nav-btn:hover { opacity: 0.85; }
        .city-nav-btn.invisible { visibility: hidden; }
        .city-nav-arrow {
            font-size: 2rem;
            line-height: 1;
            color: var(--secondary-text);
        }
        .city-nav-label {
            font-size: 0.6rem;
            text-transform: lowercase;
            color: var(--secondary-text);
            line-height: 1.3;
            text-align: center;
        }

        .hidden { display: none !important; }

        .home-title-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            width: 100%;
            justify-content: center;
        }

        .interval-control {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--secondary-text);
        }

        #intervalSlider {
            -webkit-appearance: none;
            appearance: none;
            width: 90px;
            height: 2px;
            background: var(--border-color);
            outline: none;
            cursor: pointer;
            border-radius: 1px;
        }

        #intervalSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--secondary-text);
            cursor: pointer;
        }

        #intervalSlider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--secondary-text);
            cursor: pointer;
            border: none;
        }

        #intervalLabel {
            min-width: 28px;
            text-align: left;
        }

        .home-city-overlay {
            position: absolute;
            bottom: 14px;
            left: 14px;
            font-size: 0.8rem;
            text-transform: lowercase;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            letter-spacing: 0.02em;
        }

        /* 4. FOOTER */
        footer { 
            padding: 20px 40px; font-size: 0.8rem; border-top: 1px solid var(--border-color); 
            color: var(--secondary-text); 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            text-transform: lowercase;
        }
        footer > div { flex: 1; }
        .footer-center { display: flex; justify-content: center; }
        .footer-right { text-align: right; }

        #themeToggle {
            background: none;
            border: 1px solid var(--secondary-text);
            color: var(--secondary-text);
            padding: 3px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.65rem;
            text-transform: lowercase;
            transition: all 0.2s;
        }
        #themeToggle:hover { opacity: 0.7; }

        @media (max-width: 600px) {
            header {
                flex-wrap: wrap;
                padding: 10px 12px;
                gap: 6px;
                align-items: flex-start;
            }
            .main-title {
                order: 3;
                width: 100%;
                font-size: 1.3rem;
                text-align: center;
                margin: 4px 0 0 0;
            }
            .header-item.header-left {
                order: 1;
                flex: 0 0 calc(50% - 6px);
                overflow: hidden;
            }
            .header-item.header-right {
                order: 2;
                flex: 0 0 calc(50% - 6px);
                justify-content: flex-end;
                overflow: hidden;
            }
            .bracket-box { padding: 5px; max-width: 100%; }
            .logo-text { font-size: 0.65rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .sort-label { display: none; }
            .sort-toggle { gap: 3px; }
            .sort-btn { font-size: 0.6rem; }
            .select-label { font-size: 0.72rem; }
            .arrow { font-size: 1rem; }

            main { padding: 20px 12px; }

            .main-visual {
                width: calc(100vw - 24px);
                max-width: calc(100vw - 24px);
                max-height: none;
                height: calc(100vw - 24px);
            }

            .gallery { gap: 8px; }

            .city-nav-btn { width: 40px; }
            .city-nav-label { display: none; }
            .city-nav-arrow { font-size: 1.6rem; }

            .home-title-row {
                flex-direction: column;
                gap: 8px;
            }

            footer {
                flex-direction: column;
                gap: 8px;
                padding: 16px;
                text-align: center;
            }
            footer > div { text-align: center !important; }
        }
    </style>
</head>
<body onload="initTheme()">

    <header>
        <div class="header-item header-left">
            <div class="bracket-box"><div class="bracket-inner">
                <div class="logo-text">photos by<br>martin pollehn</div>
            </div></div>
        </div>
        <h1 class="main-title">fourfold city squares</h1>
        <div class="header-item header-right">
            <div class="bracket-box"><div class="bracket-inner">
                <div class="select-wrapper">
                    <div class="sort-toggle">
                        <span class="sort-label">sort by:</span>
                        <button class="sort-btn active" id="sortByCity" onclick="setSortMode('city')">city</button>
                        <span class="sort-divider">·</span>
                        <button class="sort-btn" id="sortByCountry" onclick="setSortMode('country')">country</button>
                    </div>
                    <div class="select-container">
                        <span class="select-label" id="selectLabel">home</span><span class="arrow">▾</span>
                        <select id="citySelect" onchange="loadCity(this.value)">
                            <option value="home">home</option>
                        </select>
                    </div>
                </div>
            </div></div>
        </div>
    </header>

    <main>
        <div id="homeContainer" class="gallery-container home-container">
            <div class="home-title-row">
                <h2 style="font-weight: 300; font-size: 1.8rem; text-transform: lowercase; margin: 0;">random.picture</h2>
                <div class="interval-control">
                    <input type="range" id="intervalSlider" min="3" max="60" value="10" oninput="updateInterval(this.value)">
                    <span id="intervalLabel">10s</span>
                </div>
            </div>
            <div id="homeView" class="main-visual">
                <div class="home-city-overlay" id="homeCityName"></div>
            </div>
        </div>
        <div id="cityView" class="gallery-container hidden">
            <h2 id="cityName" style="font-weight: 300; font-size: 1.8rem; text-transform: lowercase; margin-bottom: 30px;">stadtname</h2>
            <div class="city-nav-wrapper">
                <button class="city-nav-btn" id="cityNavPrev" onclick="navigateCity(-1)">
                    <span class="city-nav-arrow">‹</span>
                    <span class="city-nav-label" id="cityNavPrevLabel"></span>
                </button>
                <div id="gallery" class="gallery"></div>
                <button class="city-nav-btn" id="cityNavNext" onclick="navigateCity(1)">
                    <span class="city-nav-arrow">›</span>
                    <span class="city-nav-label" id="cityNavNextLabel"></span>
                </button>
            </div>
        </div>
    </main>

    <footer>
        <div>&copy; 2026 martin pollehn</div>
        <div class="footer-center">
            <button id="themeToggle" onclick="toggleDarkMode()">dark mode</button>
        </div>
        <div class="footer-right">this web presence is for personal and family purposes only</div>
    </footer>

    <!-- LIGHTBOX -->
    <div id="lightbox">
        <button id="lightbox-close" onclick="closeLightbox()">✕</button>
        <button class="lightbox-nav" id="lightbox-prev" onclick="lightboxNav(-1)">‹</button>
        <img id="lightbox-img" src="" alt="">
        <button class="lightbox-nav" id="lightbox-next" onclick="lightboxNav(1)">›</button>
        <div id="lightbox-counter"></div>
    </div>

    <script src="cities.js"></script>
    <script>
        // Städteliste wird aus cities.js geladen

        function generateCityObjects(data) {
            return data.map(item => {
                const id = item[0].toLowerCase().replace(/\s+/g, '');
                return {
                    id: id,
                    city: item[0].toLowerCase(),
                    country: item[1].toLowerCase(),
                    name: `${item[0].toLowerCase()}.${item[1].toLowerCase()}`,
                    images: [`bilder/${id}1.jpg`, `bilder/${id}2.jpg`, `bilder/${id}3.jpg`, `bilder/${id}4.jpg`]
                };
            });
        }

        const cities = generateCityObjects(rawCityData);
        let currentSort = 'city';
        let currentCity = 'home';

        function measureSelectWidth() {
            // Measure select without any extra padding (arrow is now outside the select)
            const clone = document.createElement('select');
            clone.style.cssText = 'position:absolute;visibility:hidden;font-family:inherit;font-size:0.9rem;padding:0;appearance:none;';
            const homeOpt = document.createElement('option');
            homeOpt.text = 'home';
            clone.appendChild(homeOpt);
            cities.forEach(c => {
                const o = document.createElement('option');
                o.text = c.name;
                clone.appendChild(o);
            });
            document.body.appendChild(clone);
            const w = clone.offsetWidth;
            document.body.removeChild(clone);
            document.documentElement.style.setProperty('--select-width', w + 'px');
        }

        function buildOptions(sortMode) {
            const select = document.getElementById('citySelect');
            const sorted = [...cities].sort((a, b) => {
                if (sortMode === 'country') {
                    const cmp = a.country.localeCompare(b.country);
                    return cmp !== 0 ? cmp : a.city.localeCompare(b.city);
                }
                return a.city.localeCompare(b.city);
            });

            // Rebuild: keep only the home option, remove everything else
            select.innerHTML = '<option value="home">home</option>';

            if (sortMode === 'country') {
                let currentGroup = null;
                let lastCountry = null;
                sorted.forEach(city => {
                    if (city.country !== lastCountry) {
                        currentGroup = document.createElement('optgroup');
                        currentGroup.label = city.country;
                        select.appendChild(currentGroup);
                        lastCountry = city.country;
                    }
                    const opt = document.createElement('option');
                    opt.value = city.id;
                    opt.text = city.name;
                    currentGroup.appendChild(opt);
                });
            } else {
                sorted.forEach(city => {
                    const opt = document.createElement('option');
                    opt.value = city.id;
                    opt.text = city.name;
                    select.appendChild(opt);
                });
            }

            select.value = currentCity;
        }

        function setSortMode(mode) {
            currentSort = mode;
            document.getElementById('sortByCity').classList.toggle('active', mode === 'city');
            document.getElementById('sortByCountry').classList.toggle('active', mode === 'country');
            buildOptions(mode);
        }

        // Initial build
        buildOptions('city');
        measureSelectWidth();
        matchBoxWidths();

        function matchBoxWidths() {
            const boxes = document.querySelectorAll('.bracket-box');
            // boxes[0] = left, boxes[1] = right
            const maxW = Math.max(boxes[0].offsetWidth, boxes[1].offsetWidth);
            boxes.forEach(b => b.style.minWidth = maxW + 'px');
        }

        function initTheme() {
            // URL-Parameter hat Vorrang (kommt von Strato), sonst localStorage
            const urlTheme = new URLSearchParams(window.location.search).get('theme');
            const savedTheme = urlTheme || localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeToggle').innerText = "light mode";
            }
            if (urlTheme) { localStorage.setItem('theme', urlTheme); }
            initRandomCity();
            startSlideshow();
        }

        let slideshowTimer = null;

        function initRandomCity() {
            const city = cities[Math.floor(Math.random() * cities.length)];
            const imgIndex = Math.floor(Math.random() * 4) + 1;
            const imgUrl = 'bilder/' + city.id + imgIndex + '.jpg';
            document.getElementById('homeView').style.backgroundImage = 'url(' + imgUrl + ')';
            document.getElementById('homeCityName').innerText = city.name;
        }

        function startSlideshow() {
            stopSlideshow();
            const secs = parseInt(document.getElementById('intervalSlider').value);
            slideshowTimer = setInterval(initRandomCity, secs * 1000);
        }

        function stopSlideshow() {
            if (slideshowTimer) { clearInterval(slideshowTimer); slideshowTimer = null; }
        }

        function updateInterval(val) {
            document.getElementById('intervalLabel').innerText = val + 's';
            startSlideshow();
        }

        function toggleDarkMode() {
            const body = document.body;
            const btn = document.getElementById('themeToggle');
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                btn.innerText = "light mode";
                localStorage.setItem('theme', 'dark');
            } else {
                btn.innerText = "dark mode";
                localStorage.setItem('theme', 'light');
            }
        }

        function loadCity(cityId) {
            currentCity = cityId;
            const label = document.getElementById('selectLabel');
            if (cityId === 'home') { label.innerText = 'home'; }
            else { label.innerText = cities.find(c => c.id === cityId).name; }
            const homeView = document.getElementById('homeContainer');
            const cityView = document.getElementById('cityView');
            const gallery = document.getElementById('gallery');
            const cityName = document.getElementById('cityName');

            if (cityId === "home") { homeView.classList.remove('hidden'); cityView.classList.add('hidden'); initRandomCity(); startSlideshow(); } 
            else {
                homeView.classList.add('hidden');
                cityView.classList.remove('hidden');
                stopSlideshow();
                const city = cities.find(c => c.id === cityId);
                cityName.innerText = city.name;
                gallery.innerHTML = '';
                city.images.forEach((url, index) => {
                    const img = document.createElement('img');
                    img.src = url; img.alt = city.name;
                    img.onclick = () => openLightbox(city.images, index);
                    gallery.appendChild(img);
                });
                updateCityNav(cityId);
            }
        }

        function getSortedCities() {
            return [...cities].sort((a, b) => {
                if (currentSort === 'country') {
                    const cmp = a.country.localeCompare(b.country);
                    return cmp !== 0 ? cmp : a.city.localeCompare(b.city);
                }
                return a.city.localeCompare(b.city);
            });
        }

        function updateCityNav(cityId) {
            const sorted = getSortedCities();
            const idx = sorted.findIndex(c => c.id === cityId);
            const prevBtn = document.getElementById('cityNavPrev');
            const nextBtn = document.getElementById('cityNavNext');
            const prevLabel = document.getElementById('cityNavPrevLabel');
            const nextLabel = document.getElementById('cityNavNextLabel');
            if (idx > 0) {
                const prev = sorted[idx - 1];
                prevBtn.classList.remove('invisible');
                prevLabel.innerHTML = currentSort === 'country' ? prev.country + '<br>' + prev.city : prev.city + '<br>' + prev.country;
            } else { prevBtn.classList.add('invisible'); }
            if (idx < sorted.length - 1) {
                const next = sorted[idx + 1];
                nextBtn.classList.remove('invisible');
                nextLabel.innerHTML = currentSort === 'country' ? next.country + '<br>' + next.city : next.city + '<br>' + next.country;
            } else { nextBtn.classList.add('invisible'); }
        }

        function navigateCity(dir) {
            const sorted = getSortedCities();
            const idx = sorted.findIndex(c => c.id === currentCity);
            const newIdx = idx + dir;
            if (newIdx >= 0 && newIdx < sorted.length) {
                const newCity = sorted[newIdx];
                document.getElementById('citySelect').value = newCity.id;
                document.getElementById('selectLabel').innerText = newCity.name;
                loadCity(newCity.id);
            }
        }

        let lbImages = [];
        let lbIndex = 0;

        function openLightbox(images, index) {
            lbImages = images;
            lbIndex = index;
            updateLightbox();
            document.getElementById('lightbox').classList.add('active');
            document.addEventListener('keydown', lightboxKeyHandler);
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.removeEventListener('keydown', lightboxKeyHandler);
        }

        function lightboxNav(dir) {
            lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
            updateLightbox();
        }

        function updateLightbox() {
            document.getElementById('lightbox-img').src = lbImages[lbIndex];
            document.getElementById('lightbox-counter').innerText = `${lbIndex + 1} / ${lbImages.length}`;
        }

        function lightboxKeyHandler(e) {
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') lightboxNav(-1);
            if (e.key === 'ArrowRight') lightboxNav(1);
        }

        document.getElementById('lightbox').addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });
    </script>
</body>
</html>

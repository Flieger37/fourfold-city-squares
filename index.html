<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fourfold city squares</title>
    <style>
        /* 1. VARIABLEN FÜR LIGHT & DARK MODE */
        :root {
            --bg-color: #ffffff;
            --text-color: #333333;
            --border-color: #eeeeee;
            --secondary-text: #777777;
            --frame-color: #e0e0e0;
            --line-color: #cccccc;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #f0f0f0;
            --border-color: #333333;
            --secondary-text: #aaaaaa;
            --frame-color: #2a2a2a;
            --line-color: #444444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        /* 2. HEADER */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        header > .header-item { flex: 1; display: flex; align-items: stretch; }
        .header-left { min-width: 0; }
        .header-right { min-width: 0; justify-content: flex-end; }
        .bracket-box { display: flex; align-items: center; justify-content: center; }
        .bracket-inner { display: flex; align-items: center; justify-content: center; }
        .header-left { justify-content: flex-start; }
        .header-right { justify-content: flex-end; }

        /* BRACKETS */
        .bracket-box { position: relative; padding: 10px; border-radius: 6px; }
        .bracket-box::before, .bracket-box::after, .bracket-inner::before, .bracket-inner::after {
            content: ""; position: absolute; width: 6px; height: 6px; border-color: var(--text-color); border-style: solid;
        }
        .bracket-box::before { top: 0; left: 0; border-width: 1px 0 0 1px; border-top-left-radius: 6px;}
        .bracket-box::after { top: 0; right: 0; border-width: 1px 1px 0 0; border-top-right-radius: 6px;}
        .bracket-inner::before { bottom: 0; left: 0; border-width: 0 0 1px 1px; border-bottom-left-radius: 6px;}
        .bracket-inner::after { bottom: 0; right: 0; border-width: 0 1px 1px 0; border-bottom-right-radius: 6px;}

        .logo-text { font-size: 0.9rem; line-height: 1.1; text-transform: lowercase; }

        /* HAUPTTITEL */
        .main-title { 
            font-size: 2.2rem;
            font-weight: 300; 
            margin: 0; 
            line-height: 1; 
            text-transform: lowercase; 
            text-align: center; 
        }

        /* AUSWAHLMENÜ */
        .select-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .sort-label {
            font-size: 0.65rem;
            text-transform: lowercase;
            color: var(--secondary-text);
            opacity: 0.4;
            margin-right: 2px;
        }

        .sort-toggle {
            display: flex;
            justify-content: center;
            gap: 4px;
            font-size: 0.65rem;
            text-transform: lowercase;
            color: var(--secondary-text);
        }

        .sort-btn {
            background: none;
            border: none;
            padding: 0 3px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.65rem;
            color: var(--secondary-text);
            text-transform: lowercase;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .sort-btn.active {
            opacity: 1;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .sort-divider {
            color: var(--secondary-text);
            opacity: 0.4;
            line-height: 1;
            align-self: center;
        }

        .select-container { position: relative; display: inline-flex; align-items: center; justify-content: center; width: var(--select-width, auto); }
        .select-container select { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
        .select-label { font-family: inherit; font-size: 0.9rem; text-transform: lowercase; color: var(--text-color); pointer-events: none; white-space: nowrap; }
        .arrow { font-size: 1.4rem; line-height: 1; color: var(--secondary-text); pointer-events: none; margin-left: 3px; }
        #citySelect {
            font-family: inherit; 
            font-size: 0.9rem; 
            line-height: 1.1; 
            padding: 0;
            border: none; 
            outline: none; 
            background: none;
            color: var(--text-color); 
            cursor: pointer; 
            appearance: none; 
            text-transform: lowercase;
            text-align: center;
            width: var(--select-width, auto);
        }

        /* 3. CONTENT */
        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .main-visual { 
            position: relative; width: 562.5px; height: 562.5px; 
            max-width: 80vw; max-height: 70vh; aspect-ratio: 1 / 1;
            border: 7.5px solid var(--frame-color); background-size: cover; background-position: center;
            background-image: url('bilder/mein-hauptbild.jpg'); 
        }
        .main-visual::before { content: ""; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: var(--line-color); transform: translateY(-50%); }
        .main-visual::after { content: ""; position: absolute; left: 50%; top: 0; width: 2px; height: 100%; background: var(--line-color); transform: translateX(-50%); }

        .gallery-container { width: 100%; max-width: 875px; text-align: center; }
        .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; justify-items: center; }
        .gallery img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border: 7.5px solid var(--frame-color); box-sizing: border-box; }
        
        .hidden { display: none !important; }

        .home-title-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            width: 100%;
            justify-content: center;
        }

        .interval-control {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            color: var(--secondary-text);
        }

        #intervalSlider {
            -webkit-appearance: none;
            appearance: none;
            width: 90px;
            height: 2px;
            background: var(--border-color);
            outline: none;
            cursor: pointer;
            border-radius: 1px;
        }

        #intervalSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--secondary-text);
            cursor: pointer;
        }

        #intervalSlider::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--secondary-text);
            cursor: pointer;
            border: none;
        }

        #intervalLabel {
            min-width: 28px;
            text-align: left;
        }

        .home-city-overlay {
            position: absolute;
            bottom: 14px;
            left: 14px;
            font-size: 0.8rem;
            text-transform: lowercase;
            color: rgba(255,255,255,0.9);
            text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            pointer-events: none;
            letter-spacing: 0.02em;
        }

        /* 4. FOOTER */
        footer { 
            padding: 20px 40px; font-size: 0.8rem; border-top: 1px solid var(--border-color); 
            color: var(--secondary-text); 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            text-transform: lowercase;
        }
        footer > div { flex: 1; }
        .footer-center { display: flex; justify-content: center; }
        .footer-right { text-align: right; }

        #themeToggle {
            background: none;
            border: 1px solid var(--secondary-text);
            color: var(--secondary-text);
            padding: 3px 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.65rem;
            text-transform: lowercase;
            transition: all 0.2s;
        }
        #themeToggle:hover { opacity: 0.7; }
    </style>
</head>
<body onload="initTheme()">

    <header>
        <div class="header-item header-left">
            <div class="bracket-box"><div class="bracket-inner">
                <div class="logo-text">photos by<br>martin pollehn</div>
            </div></div>
        </div>
        <h1 class="main-title">fourfold city squares</h1>
        <div class="header-item header-right">
            <div class="bracket-box"><div class="bracket-inner">
                <div class="select-wrapper">
                    <div class="sort-toggle">
                        <span class="sort-label">sort by:</span>
                        <button class="sort-btn active" id="sortByCity" onclick="setSortMode('city')">city</button>
                        <span class="sort-divider">·</span>
                        <button class="sort-btn" id="sortByCountry" onclick="setSortMode('country')">country</button>
                    </div>
                    <div class="select-container">
                        <span class="select-label" id="selectLabel">home</span><span class="arrow">▾</span>
                        <select id="citySelect" onchange="loadCity(this.value)">
                            <option value="home">home</option>
                        </select>
                    </div>
                </div>
            </div></div>
        </div>
    </header>

    <main>
        <div id="homeContainer" class="gallery-container" style="display: flex; flex-direction: column; align-items: center;">
            <div class="home-title-row">
                <h2 style="font-weight: 300; font-size: 1.8rem; text-transform: lowercase; margin: 0;">random.picture</h2>
                <div class="interval-control">
                    <input type="range" id="intervalSlider" min="3" max="60" value="10" oninput="updateInterval(this.value)">
                    <span id="intervalLabel">10s</span>
                </div>
            </div>
            <div id="homeView" class="main-visual">
                <div class="home-city-overlay" id="homeCityName"></div>
            </div>
        </div>
        <div id="cityView" class="gallery-container hidden">
            <h2 id="cityName" style="font-weight: 300; font-size: 1.8rem; text-transform: lowercase; margin-bottom: 30px;">stadtname</h2>
            <div id="gallery" class="gallery"></div>
        </div>
    </main>

    <footer>
        <div>&copy; 2026 martin pollehn</div>
        <div class="footer-center">
            <button id="themeToggle" onclick="toggleDarkMode()">dark mode</button>
        </div>
        <div class="footer-right">this web presence is for personal and family purposes only</div>
    </footer>

    <script>
        const rawCityData = [
            ["antwerp", "belgium"],
            ["athens", "greece"],
            ["basseterre", "saint kitts and nevis"],
            ["bergen", "norway"],
            ["berlin", "germany"],
            ["boston", "usa"],
            ["brussels", "belgium"],
            ["budapest", "hungary"],
            ["calico", "usa"],
            ["cartagena", "colombia"],
            ["colon", "panama"],
            ["copenhagen", "denmark"],
            ["corfu town", "greece"],
            ["fort-de-france", "martinique"],
            ["gdansk", "poland"],
            ["genova", "italy"],
            ["george town", "cayman islands"],
            ["hamburg", "germany"],
            ["helsinki", "finland"],
            ["kotor", "montenegro"],
            ["las vegas", "usa"],
            ["london", "england"],
            ["los angeles", "usa"],
            ["luxembourg", "luxembourg"],
            ["malmo", "sweden"],
            ["milan", "italy"],
            ["new york", "usa"],
            ["oslo", "norway"],
            ["panama city", "panama"],
            ["paris", "france"],
            ["porto", "portugal"],
            ["prague", "czechia"],
            ["rome", "italy"],
            ["rotterdam", "netherlands"],
            ["rovaniemi", "finland"],
            ["saint john's", "antigua and barbuda"],
            ["saint petersburg", "russia"],
            ["san francisco", "usa"],
            ["san marino city", "san marino"],
            ["santo domingo", "dominican republic"],
            ["stockholm", "sweden"],
            ["tallinn", "estonia"],
            ["the hague", "netherlands"],
            ["valletta", "malta"]
        ];

        function generateCityObjects(data) {
            return data.map(item => {
                const id = item[0].toLowerCase().replace(/\s+/g, '');
                return {
                    id: id,
                    city: item[0].toLowerCase(),
                    country: item[1].toLowerCase(),
                    name: `${item[0].toLowerCase()}.${item[1].toLowerCase()}`,
                    images: [`bilder/${id}1.jpg`, `bilder/${id}2.jpg`, `bilder/${id}3.jpg`, `bilder/${id}4.jpg`]
                };
            });
        }

        const cities = generateCityObjects(rawCityData);
        let currentSort = 'city';
        let currentCity = 'home';

        function measureSelectWidth() {
            // Measure select without any extra padding (arrow is now outside the select)
            const clone = document.createElement('select');
            clone.style.cssText = 'position:absolute;visibility:hidden;font-family:inherit;font-size:0.9rem;padding:0;appearance:none;';
            const homeOpt = document.createElement('option');
            homeOpt.text = 'home';
            clone.appendChild(homeOpt);
            cities.forEach(c => {
                const o = document.createElement('option');
                o.text = c.name;
                clone.appendChild(o);
            });
            document.body.appendChild(clone);
            const w = clone.offsetWidth;
            document.body.removeChild(clone);
            document.documentElement.style.setProperty('--select-width', w + 'px');
        }

        function buildOptions(sortMode) {
            const select = document.getElementById('citySelect');
            const sorted = [...cities].sort((a, b) => {
                if (sortMode === 'country') {
                    const cmp = a.country.localeCompare(b.country);
                    return cmp !== 0 ? cmp : a.city.localeCompare(b.city);
                }
                return a.city.localeCompare(b.city);
            });

            // Rebuild: keep only the home option, remove everything else
            select.innerHTML = '<option value="home">home</option>';

            if (sortMode === 'country') {
                let currentGroup = null;
                let lastCountry = null;
                sorted.forEach(city => {
                    if (city.country !== lastCountry) {
                        currentGroup = document.createElement('optgroup');
                        currentGroup.label = city.country;
                        select.appendChild(currentGroup);
                        lastCountry = city.country;
                    }
                    const opt = document.createElement('option');
                    opt.value = city.id;
                    opt.text = city.name;
                    currentGroup.appendChild(opt);
                });
            } else {
                sorted.forEach(city => {
                    const opt = document.createElement('option');
                    opt.value = city.id;
                    opt.text = city.name;
                    select.appendChild(opt);
                });
            }

            select.value = currentCity;
        }

        function setSortMode(mode) {
            currentSort = mode;
            document.getElementById('sortByCity').classList.toggle('active', mode === 'city');
            document.getElementById('sortByCountry').classList.toggle('active', mode === 'country');
            buildOptions(mode);
        }

        // Initial build
        buildOptions('city');
        measureSelectWidth();
        matchBoxWidths();

        function matchBoxWidths() {
            const boxes = document.querySelectorAll('.bracket-box');
            // boxes[0] = left, boxes[1] = right
            const maxW = Math.max(boxes[0].offsetWidth, boxes[1].offsetWidth);
            boxes.forEach(b => b.style.minWidth = maxW + 'px');
        }

        function initTheme() {
            // URL-Parameter hat Vorrang (kommt von Strato), sonst localStorage
            const urlTheme = new URLSearchParams(window.location.search).get('theme');
            const savedTheme = urlTheme || localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeToggle').innerText = "light mode";
            }
            if (urlTheme) { localStorage.setItem('theme', urlTheme); }
            initRandomCity();
            startSlideshow();
        }

        let slideshowTimer = null;

        function initRandomCity() {
            const city = cities[Math.floor(Math.random() * cities.length)];
            const imgIndex = Math.floor(Math.random() * 4) + 1;
            const imgUrl = 'bilder/' + city.id + imgIndex + '.jpg';
            document.getElementById('homeView').style.backgroundImage = 'url(' + imgUrl + ')';
            document.getElementById('homeCityName').innerText = city.name;
        }

        function startSlideshow() {
            stopSlideshow();
            const secs = parseInt(document.getElementById('intervalSlider').value);
            slideshowTimer = setInterval(initRandomCity, secs * 1000);
        }

        function stopSlideshow() {
            if (slideshowTimer) { clearInterval(slideshowTimer); slideshowTimer = null; }
        }

        function updateInterval(val) {
            document.getElementById('intervalLabel').innerText = val + 's';
            startSlideshow();
        }

        function toggleDarkMode() {
            const body = document.body;
            const btn = document.getElementById('themeToggle');
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                btn.innerText = "light mode";
                localStorage.setItem('theme', 'dark');
            } else {
                btn.innerText = "dark mode";
                localStorage.setItem('theme', 'light');
            }
        }

        function loadCity(cityId) {
            currentCity = cityId;
            const label = document.getElementById('selectLabel');
            if (cityId === 'home') { label.innerText = 'home'; }
            else { label.innerText = cities.find(c => c.id === cityId).name; }
            const homeView = document.getElementById('homeContainer');
            const cityView = document.getElementById('cityView');
            const gallery = document.getElementById('gallery');
            const cityName = document.getElementById('cityName');

            if (cityId === "home") { homeView.classList.remove('hidden'); cityView.classList.add('hidden'); initRandomCity(); startSlideshow(); } 
            else {
                homeView.classList.add('hidden');
                cityView.classList.remove('hidden');
                stopSlideshow();
                const city = cities.find(c => c.id === cityId);
                cityName.innerText = city.name;
                gallery.innerHTML = '';
                city.images.forEach(url => {
                    const img = document.createElement('img');
                    img.src = url; img.alt = city.name;
                    gallery.appendChild(img);
                });
            }
        }
    </script>
</body>
</html>
